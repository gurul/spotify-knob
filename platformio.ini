; PlatformIO Project Configuration File
;
; Spotify Knob — a Spotify remote for the Elecrow CrowPanel 2.1" HMI ESP32
; Rotary Display (ESP32-S3-N16R8, 480x480 round ST7701S RGB panel, CST8xx
; touch, rotary encoder).

[platformio]
default_envs = crowpanel-21-rotary

; ---------------------------------------------------------------------------
; Elecrow CrowPanel 2.1" rotary display — the active target
; ---------------------------------------------------------------------------
[env:crowpanel-21-rotary]
; The official espressif32 platform tops out at Arduino core 2.0.17, which has
; no esp32-hal-periman.h — Arduino_GFX 1.6.7 will not compile against it. The
; pioarduino fork is the maintained route to core 3.x on PlatformIO.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

board_build.mcu = esp32s3
board_build.f_cpu = 240000000L

; N16R8: 16MB QIO flash + 8MB OCTAL PSRAM. The memory_type must be qio_opi or
; the PSRAM stays invisible and the 460KB framebuffer allocation fails.
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions/crowpanel_16mb.csv
board_build.filesystem = littlefs

monitor_speed = 115200
upload_speed = 921600
monitor_filters =
	esp32_exception_decoder
	time

build_unflags = -std=gnu++11
build_flags =
	-std=gnu++14
	-DCORE_DEBUG_LEVEL=3
	-DBOARD_HAS_PSRAM
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1

extra_scripts = pre:generate_compile_time.py

lib_deps =
	; Display — pinned to the version Elecrow ships, whose
	; Arduino_ESP32RGBPanel constructor signature this code matches.
	moononournation/GFX Library for Arduino @ 1.6.7
	adafruit/Adafruit BusIO @ ^1.16.1
	; Application layer
	arkhipenko/TaskScheduler @ ^3.8.5
	bodmer/TJpg_Decoder @ ^1.1.0
	bblanchon/ArduinoJson @ ^7.2.1
	https://github.com/Bodmer/OpenFontRender#5e0ec22eef4bc93f963360438a9eb8e5407ef1c4
	; SpotifyArduino is vendored in lib/SpotifyArduino (from
	; witnessmenow/spotify-api-arduino @ 62612780), not fetched: upstream
	; hard-defines SPOTIFY_DEBUG, which prints the token request body
	; (refresh token, client secret) to serial on every refresh.

; The whole application builds. One exclusion:
;   bringup_main.cpp        — Phase 1 hardware probe; define BRINGUP and swap the
;                             exclusion with main.cpp to run it again.
build_src_filter = +<*> -<bringup_main.cpp>
