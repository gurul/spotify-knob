; PlatformIO Project Configuration File
;
; Spotify Knob — ThingPulse ESP32 Spotify Remote ported to the Elecrow
; CrowPanel 2.1" HMI ESP32 Rotary Display (ESP32-S3-N16R8, 480x480 round
; ST7701S RGB panel, CST8xx touch, rotary encoder).
;
; The upstream ThingPulse environment is kept below for reference. It targets a
; plain ESP32 with an SPI ILI9488 driven by TFT_eSPI, which cannot drive an RGB
; parallel panel — that is why the display layer is replaced rather than
; reconfigured.

[platformio]
default_envs = crowpanel-21-rotary

; ---------------------------------------------------------------------------
; Elecrow CrowPanel 2.1" rotary display — the active target
; ---------------------------------------------------------------------------
[env:crowpanel-21-rotary]
; The official espressif32 platform tops out at Arduino core 2.0.17, which has
; no esp32-hal-periman.h — Arduino_GFX 1.6.7 will not compile against it. The
; pioarduino fork is the maintained route to core 3.x on PlatformIO.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

board_build.mcu = esp32s3
board_build.f_cpu = 240000000L

; N16R8: 16MB QIO flash + 8MB OCTAL PSRAM. The memory_type must be qio_opi or
; the PSRAM stays invisible and the 460KB framebuffer allocation fails.
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions/crowpanel_16mb.csv
board_build.filesystem = littlefs

monitor_speed = 115200
upload_speed = 921600
monitor_filters =
	esp32_exception_decoder
	time

build_unflags = -std=gnu++11
build_flags =
	-std=gnu++14
	-DCORE_DEBUG_LEVEL=3
	-DBOARD_HAS_PSRAM
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	; Phase 1: bringup_main.cpp provides setup()/loop(). Removed when the
	; Spotify application's main.cpp is folded back in.
	-DBRINGUP

extra_scripts = pre:generate_compile_time.py

lib_deps =
	; Display — pinned to the version Elecrow ships, whose
	; Arduino_ESP32RGBPanel constructor signature this code matches.
	moononournation/GFX Library for Arduino @ 1.6.7
	adafruit/Adafruit BusIO @ ^1.16.1
	; Application layer, carried over from ThingPulse
	arkhipenko/TaskScheduler @ ^3.8.5
	bodmer/TJpg_Decoder @ ^1.1.0
	bblanchon/ArduinoJson @ ^7.2.1
	https://github.com/Bodmer/OpenFontRender#5e0ec22eef4bc93f963360438a9eb8e5407ef1c4
	https://github.com/witnessmenow/spotify-api-arduino#62612780f40521e9833353eeefcaa0c5d16a97a5

; Phase 1 builds the board layer and the bring-up entry point only. The Spotify
; application is folded back in as its port lands; see GATES.md.
build_src_filter = +<Board/> +<bringup_main.cpp>

; ---------------------------------------------------------------------------
; Upstream ThingPulse Color Kit Grande — reference only, not built here
; ---------------------------------------------------------------------------
[env:thingpulse-color-kit-grande]
platform = espressif32@~6.10.0
board = esp-wrover-kit
framework = arduino
monitor_speed = 115200
upload_speed = 1500000
monitor_filters =
	esp32_exception_decoder
	time
build_unflags = -std=gnu++11
build_flags =
	-std=gnu++14
	-DCORE_DEBUG_LEVEL=3
	-DBOARD_HAS_PSRAM
	-mfix-esp32-psram-cache-issue
	-D USER_SETUP_LOADED=1
	-D ILI9488_DRIVER=1
	-D TFT_MISO=19
	-D TFT_MOSI=18
	-D TFT_SCLK=05
	-D TFT_CS=15
	-D TFT_DC=2
	-D TFT_RST=4
	-D TFT_BL=32
	-D LOAD_GLCD=0
	-D LOAD_FONT2=0
	-D LOAD_FONT4=0
	-D LOAD_FONT6=0
	-D LOAD_FONT7=0
	-D LOAD_FONT8=0
	-D LOAD_GFXFF=0
	-D SMOOTH_FONT=1
	-D SPI_FREQUENCY=27000000
extra_scripts = pre:generate_compile_time.py
board_build.partitions = no_ota.csv
board_build.filesystem = littlefs
lib_deps =
	arkhipenko/TaskScheduler @ ^3.8.5
	bodmer/TFT_eSPI @ ^2.5.43
	bodmer/TJpg_Decoder @ ^1.1.0
	bblanchon/ArduinoJson @ ^7.2.1
	https://github.com/Bodmer/OpenFontRender#5e0ec22eef4bc93f963360438a9eb8e5407ef1c4
	https://github.com/witnessmenow/spotify-api-arduino#62612780f40521e9833353eeefcaa0c5d16a97a5
